# 질의 용어 사전 — 사용자가 쓰는 말을 법령이 쓰는 말로 이어 준다(2026-11-21 신설).
#
# 왜: 임베딩 검색은 질문과 조문에 같은 낱말이 없으면 정답 조문을 놓친다.
#   예) "방사선사 면허" ↔ 의료기사 등에 관한 법률 제4조는 "의료기사등" 이라고만 쓰고 "방사선사" 가 없다.
#   실측(2026-11-21, gemini-embedding-001·개발 DB): 원문 MISS(10위 밖) → 병기 "방사선사(의료기사)" 1위.
#
# 규칙
#   · 질문에 term 이 있고 legal 이 아직 없으면, term 의 **첫 등장 바로 뒤에** "(legal)" 을 붙인다(병기).
#     원래 낱말을 지우지 않는다 — 치환은 다른 법령(원자력안전법 등)에서 term 자체가 쓰이는 경우를 놓친다.
#   · **검색용 질의에만** 적용한다. 생성 모델에는 사용자 원문 질문이 그대로 간다.
#   · 결정형(사전) — LLM 다시쓰기는 쓰지 않는다(지연·비용·비결정성).
#   · 항목을 더하면 `_lawbot_verify.py` 로 전 문항 recall 이 떨어지지 않았는지 확인한다.
# 런타임 반영: radsafety-lawbot 에서 `npm run sync-terms`.
terms:
  - term: 방사선사
    legal: 의료기사
    law: 의료기사 등에 관한 법률
    evidence: 평가셋 Q17 (2026-11-21 MISS → @1)
