name: Update legal data (법령·고시·별표)

on:
  schedule:
    - cron: "0 18 * * 0"   # 매주 월요일 03:00 KST (일 18:00 UTC)
  workflow_dispatch: {}     # 수동 실행 버튼

permissions:
  contents: write
  issues: write            # 개정 감지 시 알림 이슈 생성

jobs:
  update:
    # 전부 IP 무관 — legalize-kr/admrule-kr raw fetch + 공개 flDownload.
    # (구 설계의 고정 IP·Oracle VM·self-hosted runner 불필요 — admrule-kr 피벗으로 해소)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch laws (legalize-kr)
        run: bash scripts/update_laws.sh data/laws

      - name: Fetch admin-rules 고시 (admrule-kr)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 디렉토리 listing rate limit 60→5000
        run: python3 scripts/_collect_admrul.py data/admin-rules

      - name: Fetch attachments 별표 (law.go.kr flDownload · 공개)
        run: python3 scripts/_collect_attachments.py data/laws data/admin-rules data/attachments

      # 커밋 *전에* 돈다 — 워킹트리(새로 받은 것) ↔ HEAD(지난주) 비교.
      # 파일 diff 가 아니라 frontmatter 법령MST 변경분만 골라 조문 단위로 푼다.
      # 실측: 파일은 매주 바뀌어도 실제 개정은 월 1회 안팎(4주 중 1주) — 이 필터가 헛알림을 막는다.
      - name: Detect amendments (조문 단위)
        id: amend
        run: |
          if python3 scripts/_amend_report.py --format md > /tmp/amend.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "subject<<EOF"
              python3 scripts/_amend_report.py --subject
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/amend.md >> "$GITHUB_STEP_SUMMARY"

      # 파생물 재생성 — 이게 없으면 data/ 는 갱신되는데 청크만 옛 조문에 머문다.
      # 실제로 7월 내내 청크가 6/30 상태로 방치됐고(재생성이 로컬 수동이었다), 고시 청크는
      # 미러 형식 변경(07-05)으로 3주 넘게 stale 이었다. 순수 파이썬이라 CI 에서 그대로 돈다.
      # ⚠️ 별표 파싱본(attachments-parsed)만은 LibreOffice 가 필요해 여기서 못 만든다 —
      #    새 별표의 *청크* 는 도구 갖춘 로컬에서 파싱 후 커밋해야 들어온다.
      - name: Rebuild derived data (chunks · forms registry)
        id: rebuild
        run: |
          python3 scripts/_build_forms_registry.py \
                  data/laws data/admin-rules data/attachments data/attachments-forms-registry.md
          python3 scripts/_build_chunks.py 2>&1 | tee /tmp/chunks.log
          {
            echo ''
            echo '### 청크 재생성'
            echo '```'
            cat /tmp/chunks.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 파싱 실패는 예외가 아니라 '빈 결과'로 나타난다 → 조용히 지나가지 않게 알림에 얹는다.
          if grep -q '⛔' /tmp/chunks.log; then
            {
              echo ''
              echo '## ⛔ 데이터 경고 — 청크가 원본을 다 담지 못했습니다'
              grep '⛔' /tmp/chunks.log
              echo ''
              echo '> 두 종류가 여기로 옵니다.'
              echo '> · **조문 0개로 파싱된 문서** — 미러가 본문 형식을 바꿨을 수 있습니다.'
              echo '> · **파싱본 없는 별표 원본** — 별표 파싱은 LibreOffice 가 필요해 CI 에서'
              echo '>   못 돕니다. 도구 갖춘 로컬에서 `_parse_attachments.py` 실행 후 커밋해야'
              echo '>   그 별표가 청크에 들어옵니다.'
            } >> /tmp/amend.md
            echo "regression=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/laws data/admin-rules data/attachments \
                  data/chunks data/attachments-forms-registry.md
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ steps.amend.outputs.found }}" = "true" ]; then
              # 개정이 있으면 제목이 무엇이 바뀌었는지 말하게 한다(로그를 훑을 때 바로 보이도록)
              git commit -m "chore: ${{ steps.amend.outputs.subject }} ($(date -u +%Y-%m-%d))" \
                         -m "$(cat /tmp/amend.md)"
            else
              git commit -m "chore: 법령·고시·별표 갱신 $(date -u +%Y-%m-%d) (개정 없음·재가공분)"
            fi
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # 사람에게 도달하는 지점 — GitHub 알림(메일·앱)이 이슈로 온다.
      # 별도 secret 이 필요 없다(GITHUB_TOKEN). 개정이 실제로 있을 때만 연다.
      - name: Open issue on amendment
        if: ${{ (steps.amend.outputs.found == 'true' || steps.rebuild.outputs.regression == 'true') && steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 개정 없이 파싱 경고만으로 열리는 경우가 있어 제목이 비지 않게 폴백을 둔다.
          SUBJ="${{ steps.amend.outputs.subject }}"
          if [ -z "$SUBJ" ]; then SUBJ="파싱 경고 — 문서 형식 변경 의심"; fi
          gh issue create \
            --title "[법령개정] $SUBJ ($(date -u +%Y-%m-%d))" \
            --body-file /tmp/amend.md
